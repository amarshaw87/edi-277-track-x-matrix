name: Track-X-Matrix Pipeline CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code Matrix
        uses: actions/checkout@v4

      - name: Setup Node.js Environment Runtime
        uses: actions/setup-node@v4
        with:
          node-with-version: '20'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Execute Strict TypeScript Verification
        run: npm run build

      - name: Upload Production Artifacts Bundle
        uses: actions/upload-artifact@v4
        with:
          name: production-build-package
          path: dist/
          retention-days: 7
